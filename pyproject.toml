[project]
name = "bot-anagrafe"
version = "2.0.0"
description = "Bot Telegram per il registro cittadini di una simulazione politica"
requires-python = ">=3.10"
dependencies = [
    "python-telegram-bot>=21.6,<23",
    "python-dotenv>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
